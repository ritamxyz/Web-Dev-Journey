<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>
<body>
    <form action="/server">
        <fieldset>
            <legend><b>Feedback Form</b></legend>
            <br>
            <div>
                <label for="name">Name:</label>
                <input type="text" name="name" id="name" placeholder="your name">
            </div>
            <br>
            <div>
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" placeholder="your email">
            </div>
            <br>
            <div>
                <label for="msg">Message:</label>
            <br>
            <textarea name="msg" id="msq" placeholder="your feedback..."></textarea>
            </div>
            <div>
                <p>Rate these practice questions out of 5:</p>
                <input type="radio" name="value" id="one" value="one">
                <label for="one">1</label>
                <br>
                <input type="radio" name="value" id="two" value="two">
                <label for="two">2</label>
                <br>
                <input type="radio" name="value" id="three" value="three">
                <label for="three">3</label>
                <br>
                <input type="radio" name="value" id="four" value="four">
                <label for="four">4</label>
                <br>
                <input type="radio" name="value" id="five" value="five">
                <label for="five">5</label>
            </div>
            <br>
            <button>Send Your Message!</button>
        </fieldset>
    </form>
</body>
</html>
