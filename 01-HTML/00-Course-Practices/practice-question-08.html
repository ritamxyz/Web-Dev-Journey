<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting Form</title>
</head>
<body>
    <form action="https://www.google.com/search?" target="_blank">
        <input type="text" name="q" placeholder="type here...">
        <button>Search In Google.com</button>
    </form>
    <br><br>
    <form action="https://www.youtube.com/results?" target="_blank">
        <input type="text" name="search_query" placeholder="type here...">
        <button>Search In YouTube.com</button>
    </form>
</body>
</html>
