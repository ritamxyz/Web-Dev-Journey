<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up on Get Together | A Unified Campus Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="../CSS-Files/signup-page.css">
    <link rel="stylesheet" href="../CSS-Files/global.css">
    <link rel="stylesheet" href="../CSS-Files/form-responsiveness.css">
    <link rel="icon" href="../Assets/icon.jpeg">
</head>

<body>
    <main>
        <div class="info-panel">
            <div class="header">
                <i class="fa-solid fa-graduation-cap"></i>
                <div class="context">
                    <h2>Get Together</h2>
                    <p>A unified Campus Platform</p>
                </div>
            </div>
            <div class="info">
                <h1>Join Get Together</h1>
                <p>Create your account to get started with your campus journey in one place.</p>
                <div class="box-container">
                    <div class="box">
                        <i class="fa-solid fa-book-open"></i>
                        <span>Access<br>Resources</span>
                    </div>
                    <div class="box">
                        <i class="fa-regular fa-calendar-days"></i>
                        <span>Stay<br>Updated</span>
                    </div>
                    <div class="box">
                        <i class="fa-solid fa-users"></i>
                        <span>Connect<br>On Campus</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="signup-form">
            <h2>Sign Up</h2>
            <p>Create your Get Together account</p>
            <div class="input">
                <label for="name"><i class="fa-solid fa-user"></i></label>
                <input type="text" name="name" id="name" placeholder="Full Name">
            </div>
            <div class="input">
                <label for="email"><i class="fa-regular fa-envelope"></i></label>
                <input type="email" name="email" id="email" placeholder="College Email">
            </div>
            <div class="input">
                <label for="roll"><i class="fa-solid fa-user-graduate"></i></label>
                <input type="text" name="roll" id="roll" placeholder="Roll Number">
            </div>
            <div class="input">
                <label for="pass"><i class="fa-solid fa-lock"></i></label>
                <input type="password" name="pass" id="pass" placeholder="Password">
            </div>
            <div class="input">
                <label for="pass2"><i class="fa-solid fa-lock"></i></label>
                <input type="password" name="pass2" id="pass2" placeholder="Confirm Password">
            </div>
            <button>Login</button>
            <p>Already have an account? <a href="Login-Page.html">Login</a></p>
        </div>
    </main>
</body>

</html>
