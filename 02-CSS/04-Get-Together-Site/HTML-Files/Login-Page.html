<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login on Get Together | A Unified Campus Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="../CSS-Files/login-page.css">
    <link rel="stylesheet" href="../CSS-Files/global.css">
    <link rel="stylesheet" href="../CSS-Files/form-responsiveness.css">
    <link rel="icon" href="../Assets/icon.jpeg">
</head>

<body>
    <main>
        <div class="info-panel">
            <div class="header">
                <i class="fa-solid fa-graduation-cap"></i>
                <div class="context">
                    <h2>Get Together</h2>
                    <p>A unified Campus Platform</p>
                </div>
            </div>
            <div class="info">
                <h1>Welcome Back!</h1>
                <p>Login to access your academic dashboard, resources, events, and more.</p>
                <div class="box-container">
                    <div class="box">
                        <i class="fa-solid fa-book-open"></i>
                        <span>Access<br>Resources</span>
                    </div>
                    <div class="box">
                        <i class="fa-regular fa-calendar-days"></i>
                        <span>Stay<br>Updated</span>
                    </div>
                    <div class="box">
                        <i class="fa-solid fa-users"></i>
                        <span>Connect<br>On Campus</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="login-form">
            <h2>Login</h2>
            <p>Access your Get Together account</p>
            <div class="input">
                <label for="user"><i class="fa-regular fa-envelope"></i></label>
                <input type="text" name="user" id="user" placeholder="Email or Roll Number">
            </div>
            <div class="input">
                <label for="pass"><i class="fa-solid fa-lock"></i></label>
                <input type="password" name="pass" id="pass" placeholder="Password">
            </div>
            <div class="options">
                <input type="checkbox" name="remember" id="remember">
                <label for="remember">Remember me</label>
                <a href="">Forgot Password?</a>
            </div>
            <button>Login</button>
            <p>- or login with -</p>
            <div class="socials">
                <a href=""><img src="../Assets/google-icon.png"></a>
                <a href=""><img src="../Assets/github-icon.png"></a>
                <a href=""><img src="../Assets/windows-icon.png"></a>
            </div>
            <p>Don't have an account? <a href="Signup-Page.html">Sign Up</a></p>
        </div>
    </main>
</body>

</html>
