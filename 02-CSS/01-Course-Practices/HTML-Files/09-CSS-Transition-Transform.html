<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introducing CSS Transition and Transform Properties</title>
    <style>
        * {
            background-color: black;
            padding: 0;
            margin: 0;
            border: 0;
        }

        body {
            background-color: antiquewhite;
            color: aliceblue;
            width: 354px;
            margin: 0 auto;
            border: 2px dashed orange;
        }

        h1 {
            background-color: brown;
            color: aliceblue;
        }

        div {
            height: 200px;
            width: 200px;
            border: 1px solid black;
            margin: 25px auto;
        }
    </style>
    <link rel="stylesheet" href="../CSS-Files/09-CSS-Transition-Transform.css">
</head>

<body>
    <h1>Hover To See The Transitions</h1>
    <div id="rotate"></div>
    <div id="skew"></div>
    <div id="scale"></div>
    <div id="translate"></div>
</body>

</html>
